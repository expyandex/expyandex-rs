[package]
name = "expyandex-rs"
version = "1.0.0"
edition = "2021"
description = "load test"

[[bin]]
name = "expyandex-rs"
path = "src/main.rs"

[dependencies]
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
